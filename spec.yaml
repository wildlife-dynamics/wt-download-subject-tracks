id: download_subjects

requirements:
  - name: ecoscope-platform
    version: ">=2.15.0, <2.16.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/
  # rc10 ships the combined filter config + the three filter splitters, the
  # set_download_params config + its five splitters, plus the shared apply_sql_query
  # sanitize + invert_bool tasks.
  - name: ecoscope-workflows-ext-custom
    version: ">=0.1.0rc10"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/
  # ecoscope-platform already declares this exact pydeck dependency. it is
  # re-stated here as a workaround for a known issue. for further detail, see:
  # https://github.com/wildlife-dynamics/wt/issues/167#issuecomment-4451993697
  - name: pydeck
    version: 0.9.2
    channel: conda-forge

rjsf-overrides:
  properties:
    subject_obs.properties.subject_group_name.description: >-
      Specify the subject group to download observations for. Enter the exact "Subject Group" name as it appears in EarthRanger (e.g. "Ecoscope"). If you are on Ecoscope Desktop, subject group names can be found in your EarthRanger Admin site under Observations → Subject groups
    subject_obs.properties.subject_group_name.ecoscope:transform:
      - transformer: EarthRangerEnumResolver
        transformer_kws:
          type: subject_group_name
          depends_on: properties.er_client_name.properties.data_source.properties.name

    # --- Filter Data: combined filter config (one card) ---
    Filter Data.properties.subject_filters.title: ""
    Filter Data.properties.subject_filters.properties.bounding_box.description: >-
      Only include subject observations whose coordinates fall inside this bounding box.
    Filter Data.properties.subject_filters.properties.filter_point_coords.description: >-
      Exclude observations recorded at these exact coordinates (e.g. known bad GPS fixes).
    Filter Data.properties.subject_filters.properties.trajectory_segment_filter.description: >-
      Drop trajectory segments outside these length / time / speed bounds (e.g. to remove implausible jumps).

    # --- Refine Data: Process Columns (drop columns; post-split, downloads-only) ---
    Refine Data.properties.customize_columns.properties.drop_columns.default: ["location", "patrol_serial_number", "patrol_status", "patrol_subject", "patrol_type__value", "subject__content_type", "subject__device_status_properties", "subject__user", "subject__common_name", "subject__country", "subject__created_at", "subject__image_url", "subject__last_position", "subject__last_position_date", "subject__last_position_status", "subject__tracks_available", "subject__updated_at", "subject__url", "subjectsource__additional", "subjectsource__location", "subjectsource__source", "subjectsource__subject"]
    Refine Data.properties.customize_columns.properties.drop_columns.description: >-
      Columns to drop from the subject dataset, with defaults based on common Ecoscope practices. Modify the list based on your requirements.

    # --- Group Data: grouper override ---
    Group Data.properties.groupers.title: ""
    Group Data.properties.groupers.properties.groupers.description: ""
    Group Data.properties.groupers.properties.groupers.items.anyOf:
      - {"$ref": "#/$defs/ValueGrouper"}
      - {"$ref": "#/$defs/TemporalGrouper"}

    # --- Refine Data: trajectory SQL query (post-split, downloads-only) ---
    Refine Data.properties.sql_query.properties.query.title: "SQL Query"
    Refine Data.properties.sql_query.properties.query.description: >-
      Write a SQL query to filter or transform your subject trajectory data. Leave blank to skip this step. Use df as the table name (e.g., SELECT * FROM df WHERE status = 'active'). Note that queries only apply to your downloaded files and not the generated map.

    # --- Download File Format: combined download config (one card + Advanced disclosure) ---
    # Replace download_params.properties wholesale to DROP gps_point_filetypes from the
    # always-on fields; it is re-introduced below via a schema `dependencies` block so it
    # only renders once "Download GPS points" is checked. (Compiler overrides can add/replace
    # but not delete keys, so the field is removed by restating the properties block.)
    Download File Format.properties.download_params.properties:
      track_filetypes:
        title: "Track Filetypes"
        description: "The output format for the subject track files."
        type: array
        default: ["parquet"]
        uniqueItems: true
        items:
          type: string
          enum: ["csv", "parquet"]
      download_gps_points:
        title: "Download GPS points"
        type: boolean
        default: false
      track_filename_prefix:
        title: "Track filename prefix"
        description: "A name added to the beginning of your track output files. A unique ID is automatically added to the end to prevent duplicates."
        type: string
        default: "subject_tracks"
        "ecoscope:advanced": true
      gps_point_filename_prefix:
        title: "GPS point filename prefix"
        description: "A name added to the beginning of your GPS point output files. A unique ID is automatically added to the end to prevent duplicates."
        type: string
        default: "relocations"
        "ecoscope:advanced": true
    # additionalProperties must allow the conditionally-added gps_point_filetypes; with the
    # default `false` plus the form's ajv `removeAdditional: 'failing'`, ajv treats a
    # dependency-added property as "additional" and would strip the dropdown's value on submit.
    Download File Format.properties.download_params.additionalProperties: true
    # Show gps_point_filetypes ONLY when download_gps_points is checked (schema dependency).
    Download File Format.properties.download_params.dependencies:
      download_gps_points:
        oneOf:
          - properties:
              download_gps_points:
                const: false
          - properties:
              download_gps_points:
                const: true
              gps_point_filetypes:
                title: "GPS Point Filetypes"
                description: "The output format for the GPS point (relocation) files."
                type: array
                # No `default` here: a default on a conditional (dependency) branch gets
                # seeded into formData even while the false branch is active, leaving an
                # orphaned value that renders as a broken "additional property" editor when
                # the box is unchecked. The task signature still defaults to ["parquet"] at
                # runtime if the user leaves it empty.
                uniqueItems: true
                items:
                  type: string
                  enum: ["csv", "parquet"]

    # --- Generate Maps ---
    # Drop the redundant task header; the checkbox label (value.title) is enough. Blank
    # the native invert_bool description so it does NOT render above the checkbox; helper
    # text is supplied below via uiSchema ui:help.
    Generate Maps.properties.generate_maps.title: ""
    Generate Maps.properties.generate_maps.properties.value.title: "Generate maps in dashboard"
    Generate Maps.properties.generate_maps.properties.value.default: true
    Generate Maps.properties.generate_maps.properties.value.description: ""
    Generate Maps.properties.base_map_defs.properties.base_maps.title: "Map Base Layers"

  $defs:
    ValueGrouper:
      title: "Category"
      type: "object"
      properties:
        index_name:
          title: "Index Name"
          type: "string"
          oneOf:
            - const: "subject__name"
              title: "Subject Name"
            - const: "subject__subtype"
              title: "Subject Subtype"
            - const: "subject__sex"
              title: "Subject Sex"

  uiSchema:
    # coordinate-filter array lives on the combined filter config task
    Filter Data.subject_filters.filter_point_coords.items.ui:options.label: false
    # checkbox helper text → ui:help renders BELOW the checkbox (not above)
    Download File Format.download_params.download_gps_points.ui:help: >-
      Include individual GPS points with the track.
    Generate Maps.base_map_defs.base_maps.items.ui:options.label: false
    Generate Maps.generate_maps.value.ui:help: >-
      Not recommended for large datasets to improve performance.

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:
  - name: Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Data Source
    id: er_client_name
    task: set_er_connection

  - name: Time Range
    id: time_range
    task: set_time_range
    partial:
      time_format: "%d %b %Y %H:%M:%S"

  - name: Extract Timezone Selection
    id: get_timezone
    task: get_timezone_from_time_range
    partial:
      time_range: ${{ workflow.time_range.return }}

  # subject group observations
  - name: "Get Subject Group Observations from EarthRanger"
    id: subject_obs
    task: get_subjectgroup_observations
    partial:
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      raise_on_empty: false

  - name: Warn if mixed subtype
    id: warn_if_mixed_subtype
    task: mixed_subtype_warning
    skipif:
      conditions:
        - never
    partial:
      subject_obs: ${{ workflow.subject_obs.return }}

  # === FILTER LOCATIONS / SEGMENTS (combined filter config + splitters) ===
  - title: Filter Data
    type: task-group
    description: ""
    tasks:
      - name: Filters
        id: subject_filters
        task: set_traj_filters

  # combined-filter splitters — all inputs via `partial`, so they render no form fields.
  # Each returns ONE value (the compiler cannot subscript `.return[i]` in `${{ }}`).
  # Node ids differ from the task names (the compiler forbids an id that matches a
  # registered task name).
  - name: Split Bounding Box
    id: bounding_box
    task: get_bounding_box
    partial:
      filters: ${{ workflow.subject_filters.return }}

  - name: Split Point Coordinates
    id: filter_point_coords
    task: get_filter_point_coords
    partial:
      filters: ${{ workflow.subject_filters.return }}

  - name: Split Segment Filter
    id: segment_filter
    task: get_segment_filter
    partial:
      filters: ${{ workflow.subject_filters.return }}

  # --- trajectory branch (pre-split processing; param-less plain nodes, render nothing) ---
  - name: "Convert to timezone"
    id: convert_to_user_timezone
    task: convert_values_to_timezone
    partial:
      df: ${{ workflow.subject_obs.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns: ["fixtime"]

  - name: Remove Column Prefix Extra
    id: drop_extra_prefix
    task: drop_column_prefix
    partial:
      df: ${{ workflow.convert_to_user_timezone.return }}
      prefix: "extra__"
      duplicate_strategy: "suffix"

  - name: Filter Observation Relocations
    id: filter_obs
    task: apply_reloc_coord_filter
    partial:
      df: ${{ workflow.drop_extra_prefix.return }}
      bounding_box: ${{ workflow.bounding_box.return }}
      filter_point_coords: ${{ workflow.filter_point_coords.return }}
      roi_gdf: null
      roi_name: null
      reset_index: false

  - name: Build Subject Trajectories
    id: subject_traj
    task: relocations_to_trajectory
    partial:
      relocations: ${{ workflow.filter_obs.return }}
      trajectory_segment_filter: ${{ workflow.segment_filter.return }}

  - name: Remove Column Prefix Extra
    id: drop_extra_prefix_traj
    task: drop_column_prefix
    partial:
      df: ${{ workflow.subject_traj.return }}
      prefix: "extra__"
      duplicate_strategy: "suffix"

  - name: Internally Process Columns
    id: customize_columns_internally
    task: map_columns
    partial:
      df: ${{ workflow.drop_extra_prefix_traj.return }}
      rename_columns: {}
      drop_columns: ["id"] # drop 'id' to avoid conflict with `id` in the index
      retain_columns: []
      raise_if_not_found: false

  # === GROUP DATA (set_groupers + temporal index + split; all pre-SQL) ===
  # Column-dropping (Process Columns) moved post-split into Refine Data, so the temporal
  # index keys off the internal column map (only `id` dropped) — grouping is unaffected.
  - title: Group Data
    type: task-group
    description: >-
      Configure how subject trajectories are grouped (by category or temporal index) and
      split into per-group datasets for export and mapping.
    tasks:
      - name: Group Data
        id: groupers
        task: set_groupers

      - name: Add temporal index to relocations
        id: relocs_add_temporal_index
        task: add_temporal_index
        partial:
          df: ${{ workflow.filter_obs.return }}
          time_col: "fixtime"
          groupers: ${{ workflow.groupers.return }}
          cast_to_datetime: true
          format: "mixed"

      - name: Split relocs by Group
        id: split_relocs_groups
        task: split_groups
        partial:
          df: ${{ workflow.relocs_add_temporal_index.return }}
          groupers: ${{ workflow.groupers.return }}

      - name: Add temporal index to trajectories
        id: traj_add_temporal_index
        task: add_temporal_index
        partial:
          df: ${{ workflow.customize_columns_internally.return }}
          time_col: "segment_start"
          groupers: ${{ workflow.groupers.return }}
          cast_to_datetime: true
          format: "mixed"

      - name: Split Trajectory by Group
        id: split_traj_groups
        task: split_groups
        partial:
          df: ${{ workflow.traj_add_temporal_index.return }}
          groupers: ${{ workflow.groupers.return }}

  # === REFINE DATA (post-split, per-group, downloads-only): drop columns then SQL ===
  - title: Refine Data
    type: task-group
    description: >-
      Reshape and organize your subject trajectory data before downloading. Applies to the
      downloaded files only — not the generated map.
    tasks:
      - name: Process Columns
        id: customize_columns
        task: map_columns
        partial:
          rename_columns: {}
          retain_columns: []
          raise_if_not_found: false
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.split_traj_groups.return }}

      - name: Apply SQL Query
        id: sql_query
        task: apply_sql_query
        partial:
          # Hide both the columns whitelist and the sanitize toggle from the form —
          # default-on sanitize makes the whitelist unnecessary, and sanitize is fixed
          # on so SQL "just works" on complex/RGBA columns.
          sanitize: true
          columns: null
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.customize_columns.return }}

  # === DOWNLOAD FILE FORMAT (combined download config + splitters) ===
  - title: Download File Format
    type: task-group
    description: >-
      Choose the file format for your download. Parquet files are compact, fast to query, and keep all your data in a single file. Works with Python, R, QGIS, and other GIS tools.
    tasks:
      - name: Download Configuration
        id: download_params
        task: set_download_params

  # download-config splitters — all inputs via `partial`, so they render no form fields.
  - name: Split Track Filetypes
    id: track_filetypes
    task: get_track_filetypes
    partial:
      params: ${{ workflow.download_params.return }}

  - name: Split Track Filename Prefix
    id: track_filename_prefix
    task: get_track_filename_prefix
    partial:
      params: ${{ workflow.download_params.return }}

  - name: Split GPS Point Filetypes
    id: gps_point_filetypes
    task: get_gps_point_filetypes
    partial:
      params: ${{ workflow.download_params.return }}

  - name: Split GPS Point Filename Prefix
    id: gps_point_filename_prefix
    task: get_gps_point_filename_prefix
    partial:
      params: ${{ workflow.download_params.return }}

  - name: Split Relocation Persist Skip
    id: relocation_skip
    task: get_skip_relocation_persist
    partial:
      params: ${{ workflow.download_params.return }}

  - name: Skip Relocation Persistence
    id: skip_relocation_persist
    task: maybe_skip_df
    partial:
      skip: ${{ workflow.relocation_skip.return }}
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.split_relocs_groups.return }}

  - name: Persist Relocations
    id: persist_relocations
    task: persist_grouped_dfs_for_results_download
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      sanitize: true
      grouped_dfs: ${{ workflow.skip_relocation_persist.return }}
      filetypes: ${{ workflow.gps_point_filetypes.return }}
      filename_prefix: ${{ workflow.gps_point_filename_prefix.return }}
    skipif:
      conditions:
        - never

  - name: Persist Subject Trajectories
    id: persist_tracks
    task: persist_grouped_dfs_for_results_download
    partial:
      grouped_dfs: ${{ workflow.sql_query.return }}   # post-split SQL output (downloads)
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      sanitize: true
      filetypes: ${{ workflow.track_filetypes.return }}
      filename_prefix: ${{ workflow.track_filename_prefix.return }}
    skipif:
      conditions:
        - never

  - title: Generate Maps
    type: task-group
    description: >-
      Generate maps to visualize the subject trajectories.
    tasks:
      # positive "Generate maps in dashboard" toggle, chained ahead of the shared
      # maybe_skip_df task (checked = generate; value=true → return=false → don't skip)
      - name: Generate Maps in Dashboard
        id: generate_maps
        task: invert_bool

      - name: Skip Map Generation
        id: skip_map_generation
        task: maybe_skip_df
        partial:
          skip: ${{ workflow.generate_maps.return }}
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.split_traj_groups.return }}

      # Widget Names
      - name: "Set Trajectory Map Title"
        id: set_traj_map_title
        task: set_string_var
        partial:
          var: "Subject Group Trajectory Map"

      - name: " "
        id: base_map_defs
        task: set_base_maps

      - name: Apply Color to Trajectories By Subject
        id: colormap_traj
        task: assign_subject_colors
        partial:
          subject_id_column: "subject__id"
          output_column: "subject_colormap"
          fallback_strategy: default_color
          default_color: "#FFFF00"
          default_palette: "tab20b"
          additional_column: "subject__additional"
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.skip_map_generation.return }}

      - name: Sort Subject Names
        id: sort_subject_names
        task: sort_values
        partial:
          column_name: "subject__name"
          ascending: true
          na_position: "last"
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.colormap_traj.return }}

      - name: Rename columns for map tooltip display
        id: rename_display_columns
        task: map_columns
        partial:
          drop_columns: []
          retain_columns: []
          raise_if_not_found: false
          rename_columns:
            segment_start: "Start"
            timespan_seconds: "Duration (s)"
            speed_kmhr: "Speed (kph)"
            subject__name: "Subject Name"
            subject__sex: "Subject Sex"
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.sort_subject_names.return }}
      - name: Create map layer for each trajectory group
        id: traj_map_layers
        task: create_polyline_layer
        skipif:
          conditions:
            - any_is_empty_df
            - any_dependency_skipped
            - all_geometry_are_none
        partial:
          layer_style:
            color_column: "subject_colormap"
          legend:
            label_column: "Subject Name"
            color_column: "subject_colormap"
          tooltip_columns: ["Start", "Duration (s)", "Speed (kph)", "Nighttime", "Subject Name", "Subject Sex"]
        mapvalues:
          argnames: geodataframe
          argvalues: ${{ workflow.rename_display_columns.return }}
      - name: Draw Ecomaps for each trajectory group
        id: traj_ecomap
        task: draw_ecomap
        partial:
          tile_layers: ${{ workflow.base_map_defs.return }}
          north_arrow_style:
            placement: "top-left"
          legend_style:
            title: "Subject"
            format_title: false
            placement: "bottom-right"
          static: false
          title: null
          max_zoom: 20
          widget_id: ${{ workflow.set_traj_map_title.return }}
        mapvalues:
          argnames: geo_layers
          argvalues: ${{ workflow.traj_map_layers.return }}
      - name: Persist ecomap as Text
        id: ecomap_html_urls
        task: persist_text
        partial:
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: "v2"
        mapvalues:
          argnames: text
          argvalues: ${{ workflow.traj_ecomap.return }}
      - name: Create Map Widgets for Trajectories
        id: traj_map_widgets_single_views
        task: create_map_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: ${{ workflow.set_traj_map_title.return }}
        map:
          argnames: [view, data]
          argvalues: ${{ workflow.ecomap_html_urls.return }}
      - name: Merge EcoMap Widget Views
        id: traj_grouped_map_widget
        task: merge_widget_views
        partial:
          widgets: ${{ workflow.traj_map_widgets_single_views.return }}

  # dashboard
  - name: Create Dashboard with Subject Tracking Widgets
    id: subject_tracking_dashboard
    task: gather_dashboard
    partial:
      details: ${{ workflow.workflow_details.return}}
      widgets:
        - ${{ workflow.traj_grouped_map_widget.return }}
      groupers: ${{ workflow.groupers.return }}
      time_range: ${{ workflow.time_range.return}}
      warning: ${{ workflow.warn_if_mixed_subtype.return}}
