base:
  name: Base Test Case
  mock_io: false
  params:
    workflow_details:
      name: "Subject Tracking Dashboard"
      description: "A dashboard for visualizing subject trajectories and home range."
    er_client_name:
      data_source:
        name: mep_dev
    subject_filters:
      bounding_box:
        min_y: -90
        max_y: 90
        min_x: -180
        max_x: 180
      filter_point_coords: []
      trajectory_segment_filter:
        min_length_meters: 0.001
        max_length_meters: 10000.0
        max_time_secs: 21600.0
        min_time_secs: 1.0
        max_speed_kmhr: 10.0
        min_speed_kmhr: 0.01
    customize_columns:
      drop_columns: ["location", "patrol_serial_number", "patrol_status", "patrol_subject", "patrol_type__value", "subject__content_type", "subject__device_status_properties", "subject__user"]
    sql_query:
      query: ''
    groupers:
      groupers: []
    time_range:
      since: "2015-01-01T00:00:00"
      until: "2015-01-07T23:59:59"
      timezone:
        label: "Africa/Nairobi (UTC+03:00)"
        tzCode: "Africa/Nairobi"
        name: "(UTC+03:00) Nairobi"
        utc: "+03:00"
    subject_obs:
      subject_group_name: "Ecoscope"
      include_details: true
      include_subjectsource_details: true
    base_map_defs:
      base_maps:
        - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"
          opacity: 1.0
        - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
          opacity: 0.5
          max_zoom: 17
    download_params:
      download_gps_points: true
      track_filetypes: ["parquet", "csv"]
      track_filename_prefix: "subject_tracks"
      gps_point_filetypes: ["parquet"]
      gps_point_filename_prefix: "relocations"

